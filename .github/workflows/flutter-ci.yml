name: Flutter CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  flutter-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Generate initial Android scaffold
        run: |
          flutter create --platforms=android --org com.maohieng --project-name flutter_student_management_ci /tmp/student_shell
          cp -R /tmp/student_shell/android .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          p=Path('android/app/src/debug/AndroidManifest.xml')
          s=p.read_text().replace('</manifest>', '<application android:usesCleartextTraffic="true"/>\n</manifest>')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Format initial source
        run: dart format lib test
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test --coverage
      - name: Build classroom debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-management-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Export initial generated source
        if: always()
        run: |
          tar --exclude=android/.gradle --exclude=android/local.properties -czf initial-source.tar.gz android lib test pubspec.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-source
          path: initial-source.tar.gz
